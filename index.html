<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>摘星录 · 五十人集章抽卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#07070d; --ink:#e9e3d2; --dim:#9a937f; --faint:#5c574a;
  --gold:#d4ab5a; --gold-hi:#f2df9d; --gold-dim:rgba(212,171,90,.32);
  --seal:#b8434e;
  --c-SSR:#f2c14e; --c-SR:#e05c6e; --c-R:#5cb89a; --c-SP:#f6d98a;
  --sab:env(safe-area-inset-bottom,0px);
  --serif:'Noto Serif SC',serif; --brush:'Ma Shan Zheng',var(--serif);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{overscroll-behavior:none}
body{min-height:100%;background:var(--bg0);color:var(--ink);font-family:var(--serif);overflow-x:hidden}
button,input,textarea{font-family:inherit}
button{cursor:pointer;touch-action:manipulation}
button,[data-act],.card{user-select:none;-webkit-user-select:none}
.card,[data-act]{-webkit-touch-callout:none;touch-action:manipulation}
::selection{background:rgba(212,171,90,.35)}
#bg-neb{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 78% 16%, rgba(88,60,160,.16), transparent 60%),
    radial-gradient(1000px 720px at 12% 80%, rgba(30,95,125,.13), transparent 62%),
    radial-gradient(860px 860px at 42% 42%, rgba(165,125,65,.06), transparent 62%),
    linear-gradient(180deg,#05050e 0%,#070713 55%,#04040a 100%)}
#bg-neb::before,#bg-neb::after{content:'';position:absolute;inset:-22%;mix-blend-mode:screen;filter:blur(34px)}
#bg-neb::before{background:
    radial-gradient(46% 34% at 68% 26%, rgba(112,74,205,.14), transparent 70%),
    radial-gradient(40% 30% at 20% 68%, rgba(42,112,152,.12), transparent 70%);
  animation:nebdrift1 80s ease-in-out infinite alternate}
#bg-neb::after{background:
    radial-gradient(38% 30% at 80% 74%, rgba(70,60,180,.10), transparent 70%),
    radial-gradient(34% 26% at 30% 22%, rgba(190,150,80,.06), transparent 70%);
  animation:nebdrift2 110s ease-in-out infinite alternate}
@keyframes nebdrift1{to{transform:translate3d(4%,3%,0) scale(1.07)}}
@keyframes nebdrift2{to{transform:translate3d(-4%,-3%,0) scale(1.05)}}
#bg-photo{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;display:none}
#bg-photo::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%,transparent 15%,rgba(5,5,11,.87) 100%),linear-gradient(rgba(5,5,11,.42),rgba(5,5,11,.42))}
#sky{position:fixed;inset:0;z-index:0}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 28%,transparent 35%,rgba(5,5,10,.82) 100%)}
#app{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 18px 60px}
.screen{animation:rise .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.btn{border:1px solid var(--gold-dim);background:#10101a;color:var(--ink);padding:10px 22px;font-size:15px;letter-spacing:.18em;border-radius:3px;transition:.25s;position:relative}
.btn:hover{border-color:var(--gold);color:var(--gold-hi);background:#141420}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:600}
.btn.primary:hover{background:var(--gold-hi)}
.btn.danger{border-color:rgba(184,67,78,.6);color:#d98a92}
.btn.danger:hover{border-color:var(--seal);color:#f0a8ae}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{padding:5px 12px;font-size:12px;letter-spacing:.05em}
.seal{display:inline-grid;place-items:center;background:var(--seal);color:#f7e9d8;font-family:var(--brush);border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(247,233,216,.5),0 2px 8px rgba(0,0,0,.4)}
.kicker{font-size:12px;letter-spacing:.5em;color:var(--dim);text-indent:.5em}

.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px}
.home-brand{position:relative;margin-bottom:10px}
.home-title{font-family:var(--brush);font-size:clamp(66px,13vw,136px);line-height:1;color:var(--gold-hi);letter-spacing:.06em;text-shadow:0 3px 0 #00000055}
.home-seal{position:absolute;right:-58px;top:6px;width:44px;height:44px;font-size:17px;line-height:1.05;transform:rotate(7deg);padding:4px}
.home-sub{color:var(--dim);letter-spacing:.42em;font-size:14px;margin:6px 0 4px;text-indent:.42em}
.home-line{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:13px;margin:26px 0 34px}
.home-line::before,.home-line::after{content:'';width:72px;height:1px;background:var(--gold-dim)}
.gates{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.gate{width:236px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,#11111c,#0b0b13);padding:26px 20px 22px;border-radius:4px;transition:.3s;position:relative;overflow:hidden}
.gate:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.gate::before{content:'';position:absolute;inset:6px;border:1px solid rgba(212,171,90,.16);border-radius:2px;pointer-events:none}
.gate .g-t{font-family:var(--brush);font-size:26px;color:var(--gold-hi);letter-spacing:.12em}
.gate .g-s{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:.2em}
.gate .g-go{margin-top:16px;display:inline-block;font-size:13px;color:var(--gold);letter-spacing:.3em;border-bottom:1px solid var(--gold-dim);padding-bottom:3px}
.home-foot{margin-top:60px;color:var(--faint);font-size:12px;letter-spacing:.24em}

.mini-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
.mini-box{text-align:center;max-width:400px;width:100%}
.mini-box h2{font-family:var(--brush);font-size:44px;color:var(--gold-hi);letter-spacing:.1em;margin:10px 0 22px}
.field{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.field input{width:170px;background:#0b0b13;border:1px solid var(--gold-dim);color:var(--ink);padding:12px 14px;font-size:16px;letter-spacing:.2em;border-radius:3px;text-align:center;outline:none;transition:.25s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,171,90,.14)}
.mini-tip{color:var(--faint);font-size:12px;letter-spacing:.14em;margin-top:14px;line-height:1.8}
.mini-links{margin-top:22px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.mini-links a{color:var(--dim);font-size:13px;letter-spacing:.14em;cursor:pointer;border-bottom:1px dashed var(--gold-dim);padding-bottom:2px}
.mini-links a:hover{color:var(--gold)}
.back-link{margin-top:26px;display:inline-block;color:var(--dim);font-size:13px;letter-spacing:.2em;cursor:pointer;transition:.2s}
.back-link:hover{color:var(--gold)}
.shakex{animation:shakex .4s}
@keyframes shakex{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stu-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.stu-tabs button{border:1px solid var(--gold-dim);background:none;color:var(--dim);padding:8px 26px;letter-spacing:.24em;font-size:14px;border-radius:3px}
.stu-tabs button.on{color:#1a1408;background:var(--gold);border-color:var(--gold)}

.cloud-strip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);letter-spacing:.1em;padding:8px 12px;border:1px dashed var(--gold-dim);border-radius:4px;margin-top:12px;flex-wrap:wrap}
.cloud-strip.ok{color:#b8e6d5;border-color:rgba(92,184,154,.4)}
.cloud-strip.err{color:#f0b9be;border-color:rgba(184,67,78,.5)}
.cloud-strip .cs-btn{margin-left:auto}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 14px;gap:10px;flex-wrap:wrap}
.topbar .tb-title{font-family:var(--brush);font-size:30px;color:var(--gold-hi);letter-spacing:.08em}
.tb-btns{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{background:none;border:1px solid var(--gold-dim);color:var(--dim);padding:8px 14px;border-radius:3px;font-size:13px;letter-spacing:.15em;transition:.2s}
.icon-btn:hover{color:var(--gold);border-color:var(--gold)}
.icon-btn.warn{color:#d9a0a8;border-color:rgba(184,67,78,.45)}
.idcard{display:flex;gap:26px;align-items:stretch;border:1px solid var(--gold-dim);background:linear-gradient(180deg,#10101a,#0b0b13);border-radius:5px;padding:24px 28px;position:relative;overflow:hidden}
.idcard::before{content:'';position:absolute;inset:7px;border:1px solid rgba(212,171,90,.14);border-radius:3px;pointer-events:none}
.id-name{min-width:120px;border-right:1px solid var(--gold-dim);padding-right:24px}
.id-no{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.id-real{font-family:var(--brush);font-size:40px;color:var(--ink);line-height:1.15;margin-top:6px}
.stamp-row{flex:1;display:flex;gap:18px;justify-content:space-around}
.stamp{display:flex;flex-direction:column;align-items:center;gap:7px}
.stamp .s-dot{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;position:relative;background:rgba(212,171,90,.05)}
.stamp .s-dot b{font-size:26px;color:var(--gold-hi);font-weight:900}
.stamp .s-lab{font-size:12px;color:var(--dim);letter-spacing:.24em}
.stamp.hl .s-dot{border-color:var(--c-SR);box-shadow:0 0 18px rgba(224,92,110,.25)}
.stamp.hl .s-dot b{color:#f09aa6}
.a-track{margin-top:20px}
.a-track .a-lab{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-bottom:8px}
.a-dots{display:flex;gap:8px}
.a-dots i{width:26px;height:26px;border:1px solid var(--gold-dim);border-radius:3px;transform:rotate(45deg) scale(.78);transition:.3s}
.a-dots i.on{background:var(--seal);border-color:var(--seal);box-shadow:inset 0 0 0 1.5px rgba(247,233,216,.5),0 0 10px rgba(184,67,78,.4)}
.a-note{font-size:12px;color:var(--faint);margin-top:10px;letter-spacing:.1em}
.luck-strip{margin-top:14px;border:1px dashed var(--gold-dim);border-radius:4px;padding:9px 14px;font-size:12px;color:var(--dim);letter-spacing:.12em;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.luck-strip b{color:var(--gold-hi);font-size:14px}
.luck-strip .ls-t{color:var(--gold);letter-spacing:.3em}

.altar{margin:34px 0 8px;text-align:center}
.altar .al-t{font-family:var(--brush);font-size:28px;color:var(--gold-hi);letter-spacing:.3em}
.altar .al-s{font-size:12px;color:var(--dim);letter-spacing:.3em;margin-top:6px}
.sticks{display:flex;gap:20px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-top:26px}
.stick{width:190px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,#12121d,#0b0b13);border-radius:5px 5px 3px 3px;padding:20px 16px 18px;position:relative;transition:.3s}
.stick:nth-child(2){transform:translateY(-14px)}
.stick:nth-child(3){transform:translateY(-28px)}
.stick:hover{border-color:var(--gold)}
.stick .k-t{font-family:var(--brush);font-size:24px;color:var(--ink);letter-spacing:.2em}
.stick .k-cost{margin:10px auto 4px;width:max-content;padding:2px 10px;border:1px solid var(--gold-dim);border-radius:99px;font-size:12px;color:var(--gold);letter-spacing:.1em}
.stick .k-d{font-size:12px;color:var(--dim);letter-spacing:.06em;min-height:32px;margin:6px 0 12px}
.stick .btn{width:100%}
.stick .k-tag{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 6px;border-radius:2px;background:rgba(224,92,110,.15);color:#e8859b;border:1px solid rgba(224,92,110,.4)}
.free-strip{margin-top:22px;border:1px dashed rgba(92,184,154,.5);border-radius:4px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(92,184,154,.05)}
.free-strip .fs-t{color:var(--c-R);font-size:13px;letter-spacing:.14em}

.tabs{display:flex;gap:8px;margin:38px 0 18px;flex-wrap:wrap}
.tabs button{border:1px solid var(--gold-dim);background:none;color:var(--dim);padding:8px 20px;letter-spacing:.2em;font-size:14px;border-radius:3px;transition:.2s;white-space:nowrap}
.tabs button.on{color:#1a1408;background:var(--gold);border-color:var(--gold)}
.tabs button .bdg{color:#ffb9c1;font-size:13px}
.rar-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rar-tabs button{padding:4px 14px;font-size:12px;letter-spacing:.1em;border-radius:2px;border:1px solid var(--gold-dim);background:none;color:var(--dim);transition:.2s}
.rar-tabs button.on{color:var(--gold-hi);border-color:var(--gold)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.album .cell{position:relative}
.cell-name{text-align:center;font-size:12px;color:var(--dim);margin-top:7px;letter-spacing:.1em}
.cell-name .owned{color:var(--gold)}
.log-list{border:1px solid var(--gold-dim);border-radius:5px;overflow:hidden}
.log-item{display:flex;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid rgba(212,171,90,.14);font-size:13px;flex-wrap:wrap}
.log-item:last-child{border-bottom:none}
.log-item .lt{color:var(--faint);font-size:12px;min-width:96px}
.log-item .lc{color:var(--gold);min-width:110px}
.rtag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:2px;margin-right:6px;font-weight:600}
.rtag.SP{background:rgba(246,217,138,.15);color:var(--c-SP);border:1px solid rgba(246,217,138,.5)}
.rtag.SSR{background:rgba(242,193,78,.13);color:var(--c-SSR);border:1px solid rgba(242,193,78,.45)}
.rtag.SR{background:rgba(224,92,110,.12);color:var(--c-SR);border:1px solid rgba(224,92,110,.45)}
.rtag.R{background:rgba(92,184,154,.1);color:var(--c-R);border:1px solid rgba(92,184,154,.4)}
.empty{padding:40px;text-align:center;color:var(--faint);letter-spacing:.2em;font-size:13px}

.col-head{display:flex;gap:26px;align-items:center;border:1px solid var(--gold-dim);border-radius:5px;background:linear-gradient(180deg,#10101a,#0b0b13);padding:18px 22px;margin-bottom:16px;flex-wrap:wrap}
.comp-ring{position:relative;width:92px;height:92px;flex:none}
.comp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cr-bg{fill:none;stroke:rgba(212,171,90,.18);stroke-width:6}
.cr-fg{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.cr-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cr-txt b{font-size:22px;color:var(--gold-hi);font-weight:900}
.cr-txt b i{font-size:12px;color:var(--dim);font-style:normal;font-weight:400}
.cr-txt span{font-size:10px;color:var(--dim);letter-spacing:.3em;text-indent:.3em}
.col-mid{flex:1;min-width:250px}
.cm-line{font-size:13px;color:var(--dim);letter-spacing:.08em;margin-bottom:12px}
.cm-line b{color:var(--gold-hi);font-size:16px}
.ach-row{display:flex;gap:13px;flex-wrap:wrap}
.ach-seal{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px}
.as-box{width:52px;height:52px;display:grid;place-items:center;border-radius:6px;font-size:11px;line-height:1.25;text-align:center;padding:3px;letter-spacing:.04em;transition:.3s}
.ach-seal.got .as-box{background:var(--seal);color:#f7e9d8;box-shadow:inset 0 0 0 1.5px rgba(247,233,216,.5),0 3px 10px rgba(0,0,0,.4);transform:rotate(-4deg)}
.ach-seal:not(.got) .as-box{border:1px dashed var(--faint);color:var(--faint);opacity:.55}
.as-d{font-size:10px;color:var(--faint);text-align:center;line-height:1.5}
.ach-seal.got .as-d{color:var(--dim)}

.code-txt{font-family:ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:.28em;color:var(--gold-hi);border:1px dashed var(--gold);padding:7px 8px 7px 15px;border-radius:4px;background:rgba(212,171,90,.07);font-size:18px;white-space:nowrap;display:inline-block}
.code-txt.sm{font-size:14px;padding:4px 4px 4px 11px;letter-spacing:.2em}
.rd-row{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px dashed rgba(212,171,90,.25)}
.rd-row:last-child{border-bottom:none}
.rd-info{display:flex;flex-direction:column;gap:3px}
.rd-info b{font-size:15px}
.rd-info span{font-size:12px;color:var(--dim)}
.sec-title{font-size:13px;color:var(--gold);letter-spacing:.3em;margin:24px 0 10px}

.cd-wrap{display:flex;gap:22px;align-items:flex-start}
.cd-card{flex:none}
.cd-info{flex:1;min-width:0}
.cd-name{font-family:var(--brush);font-size:24px;color:var(--gold-hi);letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.cd-name .rtag{font-family:var(--serif);font-size:11px;margin:0}
.cd-lore{font-size:13px;color:var(--dim);line-height:1.9;margin-bottom:10px;border-left:2px solid var(--gold-dim);padding-left:12px}
.cd-rw{font-size:14px;margin-bottom:6px}
.cd-rw b{color:var(--gold-hi)}
.cd-own{font-size:12px;color:var(--dim);margin-bottom:12px;letter-spacing:.06em}
.cd-codes-t{font-size:12px;color:var(--c-SR);letter-spacing:.14em;margin-bottom:8px}
.cd-codes .code-txt{margin:0 6px 6px 0;cursor:pointer}
.cd-codes .code-txt:hover{background:rgba(212,171,90,.16)}
.cd-none{font-size:12px;color:var(--faint);letter-spacing:.1em}

.card{position:relative;width:var(--cw,104px);aspect-ratio:5/7;perspective:800px;flex:none}
.card[data-act]{cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.25,.75,.3,1);transform:rotateY(180deg)}
.card.flipped .card-inner,.card.static .card-inner{transform:rotateY(0)}
.card.static .card-inner{transition:none}
.f-face,.f-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;overflow:hidden}
.f-face{background:var(--cbg,#101018);border:1px solid var(--clin,#888)}
.f-back{transform:rotateY(180deg);background:#0c0c14;border:1px solid rgba(212,171,90,.55)}
.f-face::after{content:'';position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--clin) 45%,transparent);border-radius:4px;pointer-events:none;z-index:2}
.card[data-r="R"]{--cbg:#0b1714;--clin:#5cb89a;--cglow:rgba(92,184,154,.5)}
.card[data-r="SR"]{--cbg:#1c0d11;--clin:#e05c6e;--cglow:rgba(224,92,110,.5)}
.card[data-r="SSR"]{--cbg:#191405;--clin:#f2c14e;--cglow:rgba(242,193,78,.55)}
.card[data-r="SP"]{--cbg:#130e08;--clin:#f6d98a;--cglow:rgba(246,217,138,.7)}
.card[data-r="SSR"]:not(.locked) .f-face::before,
.card[data-r="SP"]:not(.locked) .f-face::before,
.card[data-r="SP"]:not(.locked) .f-back::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,248,220,.16) 47%,transparent 62%);transform:translateX(-130%);animation:sheen 3.4s ease-in-out infinite;z-index:1}
.card[data-r="SR"]:not(.locked) .f-face::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,235,240,.1) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 4.6s ease-in-out infinite;z-index:1}
.card[data-r="SP"]:not(.locked) .f-face{animation:hueshift 4.5s linear infinite}
@keyframes sheen{60%,100%{transform:translateX(130%)}}
@keyframes hueshift{to{filter:hue-rotate(360deg)}}
.c-art{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.c-halo{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 46% 44%,hsla(var(--h),85%,62%,.26),transparent 62%)}
.card.play .r-rays{animation:rot 26s linear infinite}
.card.play .r-rays2{animation:rotR 34s linear infinite}
@keyframes rotR{to{transform:rotate(-360deg)}}
.card.play .tw{animation:twk 2.4s ease-in-out infinite}
.card.play .tw.d2{animation-delay:.8s}
.card.play .tw.d3{animation-delay:1.6s}

.c-vname{position:absolute;top:13%;right:10px;writing-mode:vertical-rl;font-family:var(--brush);font-size:calc(var(--cw)*.115);letter-spacing:.16em;color:var(--ink);opacity:.92;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.c-sub{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.078);color:var(--dim);padding:0 6px;letter-spacing:.02em;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.f-back .b-mid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(var(--cw)*.5);height:calc(var(--cw)*.5)}
.f-back .b-brand{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.085);letter-spacing:.6em;color:var(--gold);text-indent:.6em;opacity:.8}
.f-back .b-top{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:calc(var(--cw)*.085);letter-spacing:.4em;color:var(--gold-dim);text-indent:.4em}
.b-mid .rot1{animation:rot 20s linear infinite;transform-origin:50% 50%}
.b-mid .rot2{animation:rot 14s linear infinite reverse;transform-origin:50% 50%}

.c-count{position:absolute;top:-7px;right:-7px;z-index:3;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--gold);color:#1a1408;font-size:13px;font-weight:600;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.card.locked .f-face{filter:grayscale(1) brightness(.42)}
.card.locked .c-glyph{filter:blur(3px)}
.card.locked .c-vname{opacity:.35}
.sp-gone{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(10,10,16,.68);font-size:11px;color:#d9b8a0;letter-spacing:.3em;writing-mode:vertical-rl;padding:8px;border-radius:7px}
.pend-dot{position:absolute;top:-7px;left:-7px;z-index:3;background:var(--seal);color:#f7e9d8;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid rgba(247,233,216,.5);box-shadow:0 3px 8px rgba(0,0,0,.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.card[data-r="SSR"]:not(.locked) .f-face{animation:cardbreath 3s ease-in-out infinite}
@keyframes cardbreath{50%{box-shadow:0 0 18px 2px var(--cglow),inset 0 0 14px rgba(242,193,78,.18)}}
.card[data-r="SR"]:not(.locked) .f-face{animation:cardbreath2 3.4s ease-in-out infinite}
@keyframes cardbreath2{50%{box-shadow:0 0 13px 1px var(--cglow)}}
.card[data-r="R"]:not(.locked) .c-glyph{animation:rtwinkle 2.6s ease-in-out infinite}
@keyframes rtwinkle{50%{text-shadow:0 2px 14px var(--cglow),0 0 6px hsla(var(--h),85%,60%,.55)}}
.card[data-r="SSR"]:not(.locked) .c-glyph,.card[data-r="SP"]:not(.locked) .c-glyph{animation:glyphfloat 3.8s ease-in-out infinite}
@keyframes glyphfloat{50%{transform:translate(-50%,-60%)}}
.card[data-r="SP"]:not(.locked) .c-glyph::before{content:'';position:absolute;left:50%;top:50%;width:175%;height:175%;transform:translate(-50%,-50%);border:1.5px dashed rgba(246,217,138,.5);border-radius:50%;animation:rot 10s linear infinite}
.c-orbit{position:absolute;inset:0;animation:rot 6.5s linear infinite;pointer-events:none;z-index:1}
.c-orbit::before{content:'';position:absolute;left:50%;top:7%;width:calc(var(--cw)*.055);height:calc(var(--cw)*.055);min-width:5px;min-height:5px;margin-left:calc(var(--cw)*-.028);border-radius:50%;background:#fff3c4;box-shadow:0 0 9px 3px rgba(255,236,180,.85)}

#stage{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:rgba(4,4,9,.95);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#stage.on{display:flex;animation:fadein .3s}
.st-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 620px at 50% 26%, rgba(95,72,190,.15), transparent 66%),
    radial-gradient(760px 560px at 84% 82%, rgba(34,96,132,.12), transparent 66%),
    radial-gradient(600px 480px at 12% 78%, rgba(60,50,150,.10), transparent 68%),
    linear-gradient(180deg,#05050e 0%,#040409 100%);
  opacity:.94;transition:opacity .8s}
.st-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 24%,rgba(4,4,9,.88) 100%)}
#stage.dimmed .st-bg{opacity:.35}
.st-shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(4,4,9,.2),rgba(4,4,9,.9) 80%);opacity:0;transition:opacity .9s;z-index:1;pointer-events:none}
#stage.dimmed .st-shade{opacity:1}
.st-sigil{position:absolute;left:50%;top:44%;width:min(44vmin,360px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.45);opacity:0;transition:.55s cubic-bezier(.2,.8,.3,1);z-index:2}
.st-sigil.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.st-sigil.off{opacity:0;transform:translate(-50%,-50%) scale(1.7)}
.st-sigil svg{width:100%;height:100%;overflow:visible}
.s-outer{animation:rot 26s linear infinite;transform-origin:50% 50%}
.s-inner{animation:rot 16s linear infinite reverse;transform-origin:50% 50%}
.st-sigil.hot .s-outer{animation-duration:2.2s}
.st-sigil.hot .s-inner{animation-duration:1.6s}
.st-sigil.madd .s-outer{animation-duration:.7s}
.st-sigil.madd .s-inner{animation-duration:.45s}
.st-beam{position:absolute;left:50%;top:44%;width:64px;height:62vh;transform:translate(-50%,-50%) scaleY(0);background:linear-gradient(180deg,transparent,rgba(242,223,157,.9),transparent);filter:blur(7px);opacity:0;z-index:2;pointer-events:none}
.st-beam.go{animation:beam .5s ease-out forwards}
@keyframes beam{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.1)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scaleY(1.15)}}
.st-wall{position:relative;z-index:3;display:grid;gap:16px;grid-template-columns:repeat(var(--cols,5),auto);justify-content:center;align-content:center;flex:1;width:100%;max-width:860px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 8px}
.st-wall.solo{grid-template-columns:1fr}
@media(max-width:640px){.st-wall:not(.solo){grid-template-columns:repeat(3,auto);gap:10px}}
.slot{animation:slot-in .5s cubic-bezier(.2,.8,.3,1) backwards;position:relative}
@keyframes slot-in{from{opacity:0;transform:translateY(50px) scale(.78)}}
.slot.single{--cw:min(210px,64vw);animation:none;transition:transform .95s cubic-bezier(.16,1,.3,1);transform-origin:center center;will-change:transform}
.slot.single .card:not(.flipped){animation:slot-in .6s backwards, floaty 3.4s 1.1s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-7px)}}
.st-wall:not(.solo) .slot{--cw:clamp(86px,13vw,118px)}
@media(max-width:640px){.st-wall:not(.solo) .slot{--cw:clamp(80px,27vw,110px)}}
.card.praise{transform:scale(1.08);transition:transform .45s;z-index:5}
.st-hint{text-align:center;color:var(--dim);padding:14px 0 4px;letter-spacing:.4em;font-size:13px;text-indent:.4em;min-height:24px}
.st-actions{display:flex;gap:14px;justify-content:center;padding:12px 0 calc(34px + var(--sab));flex-wrap:wrap}
.st-skip{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:20px;color:var(--faint);font-size:12px;letter-spacing:.2em;cursor:pointer;z-index:7;transition:.2s;padding:8px 12px}
.st-skip:hover{color:var(--gold)}
.st-tag{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:22px;color:var(--gold-dim);font-size:12px;letter-spacing:.34em;z-index:5}
.settle{display:flex;flex-direction:column;align-items:center;gap:14px;animation:rise .5s both}
.settle .s-line{color:var(--dim);font-size:14px;letter-spacing:.12em;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.st-reveal-t{position:fixed;top:calc(5% + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:6;pointer-events:none;opacity:0;transform:translateY(-16px);transition:.6s cubic-bezier(.2,.9,.3,1)}
.st-reveal-t.on{opacity:1;transform:none}
.st-reveal-t .rv-r{font-family:var(--brush);font-size:clamp(34px,6vmin,56px);color:hsl(var(--h),90%,76%);text-shadow:0 0 26px hsla(var(--h),90%,60%,.5),0 2px 0 rgba(0,0,0,.4);letter-spacing:.3em;text-indent:.3em}
.st-reveal-b{position:fixed;left:0;right:0;bottom:calc(96px + var(--sab));text-align:center;z-index:6;pointer-events:none;opacity:0;transform:translateY(18px);transition:.6s .12s cubic-bezier(.2,.9,.3,1)}
.st-reveal-b.on{opacity:1;transform:none}
.st-reveal-b .rv-name{font-family:var(--brush);font-size:clamp(30px,5vmin,44px);color:hsl(var(--h),85%,80%);text-shadow:0 0 20px hsla(var(--h),85%,60%,.55),0 2px 0 rgba(0,0,0,.4);letter-spacing:.12em}
.st-reveal-b .rv-rw{display:block;margin-top:8px;font-size:14px;color:var(--dim);letter-spacing:.22em}
body.quake .st-wall,body.quake .st-sigil{animation:quake .5s}
@keyframes quake{0%,100%{margin:0}20%{transform:translate(-7px,5px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-5px)}80%{transform:translate(4px,4px)}}

.st-comet{position:fixed;top:-50px;left:82vw;width:12px;height:12px;border-radius:50%;background:#fff8dc;box-shadow:0 0 16px 6px rgba(255,236,180,.85),0 0 46px 16px rgba(255,236,180,.35);z-index:64;opacity:0;pointer-events:none}

.st-comet.go{animation:cometfall .95s cubic-bezier(.45,0,.85,.55) forwards}
@keyframes cometfall{0%{opacity:0;transform:translate(0,0)}6%{opacity:1}100%{opacity:1;transform:translate(-32vw,48vh)}}
.st-flash{position:fixed;inset:0;z-index:68;background:radial-gradient(circle at 50% 44%,#fff9e8,#ffe9b0 40%,transparent 75%);opacity:0;pointer-events:none}
.st-flash.go{animation:flashgo .55s ease-out forwards}
@keyframes flashgo{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.sp-title{position:fixed;inset:0;z-index:66;transition:opacity .5s;pointer-events:none}
.sp-title.off{opacity:0}
.sp-title .t-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(6,6,12,.15),rgba(6,6,12,.8) 75%)}
.sp-title .t-inner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:flex-start;gap:clamp(10px,2.4vmin,26px)}
.sp-title .t-ch{font-family:var(--brush);font-size:clamp(58px,11vmin,104px);line-height:1;color:#f6d98a;text-shadow:0 0 30px rgba(246,217,138,.5),0 4px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(30px) scale(.7)}
.sp-title .t-ch.on{animation:chIn .55s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes chIn{to{opacity:1;transform:none}}
.sp-title .t-seal{width:58px;height:58px;font-size:18px;line-height:1.15;margin-top:8px;opacity:0;transform:rotate(10deg) scale(2.4)}
.sp-title .t-seal.on{animation:sealIn .4s cubic-bezier(.25,1.5,.4,1) forwards}

#fx{position:fixed;inset:0;z-index:99;pointer-events:none}
.fx-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 9px 2px rgba(242,223,157,.8)}
.fx-ring{position:absolute;border-radius:50%;border:2px solid;transform:translate(-50%,-50%) scale(.1);animation:ring-out .75s cubic-bezier(.15,.6,.35,1) forwards}

.fx-rays{position:absolute;width:0;height:0}
.fx-rays i{position:absolute;left:-2px;top:-95px;width:4px;height:95px;background:linear-gradient(to top,transparent,var(--rc,#f2c14e));transform-origin:50% 100%;animation:rayout .65s ease-out forwards}
@keyframes rayout{0%{transform:rotate(var(--r)) scaleY(0);opacity:1}60%{opacity:1}100%{transform:rotate(var(--r)) scaleY(1.7);opacity:0}}

.fx-amb{position:fixed;inset:0;pointer-events:none;animation:amb 1.05s ease forwards}
@keyframes amb{0%{opacity:0}18%{opacity:var(--ao,.18)}100%{opacity:0}}
.fx-neb{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(58% 52% at 50% 42%, rgba(120,92,225,.60), transparent 62%),
    radial-gradient(42% 40% at 38% 56%, rgba(50,110,190,.35), transparent 65%),
    radial-gradient(40% 36% at 64% 34%, rgba(190,120,60,.22), transparent 66%);
  animation:neb 1.3s ease forwards}
@keyframes neb{0%{opacity:0;transform:scale(.72)}22%{opacity:var(--no,.5)}100%{opacity:0;transform:scale(1.28)}}
.fx-aurora{position:fixed;inset:-80px;background:repeating-linear-gradient(115deg,rgba(184,67,110,.5) 0 60px,rgba(212,145,58,.5) 60px 120px,rgba(58,138,92,.5) 120px 180px,rgba(58,106,184,.5) 180px 240px);filter:blur(64px);mix-blend-mode:screen;opacity:0;animation:aurora 2.6s ease forwards,hueshift 2.6s linear}

.t-stats{display:flex;flex-wrap:wrap;border:1px solid var(--gold-dim);border-radius:5px;background:linear-gradient(180deg,#10101a,#0b0b13);margin:16px 0}
.t-stat{flex:1;min-width:120px;padding:18px 10px;text-align:center;border-right:1px solid rgba(212,171,90,.14)}
.t-stat:last-child{border-right:none}

.t-stat.hl b{color:#f09aa6}
.t-stat span{font-size:12px;color:var(--dim);letter-spacing:.2em}
.t-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.t-tools input[type=search],.t-tools input[type=text]{flex:1;min-width:180px;background:#0b0b13;border:1px solid var(--gold-dim);color:var(--ink);padding:8px 14px;border-radius:3px;outline:none;letter-spacing:.08em}

table{width:100%;border-collapse:collapse;min-width:700px}

td{padding:10px;border-bottom:1px solid rgba(212,171,90,.1);font-size:14px;white-space:nowrap;vertical-align:middle}

tr:hover td{background:rgba(212,171,90,.04)}
.dim-row td{opacity:.6}

.acc-tag{cursor:pointer;font-size:12px;padding:2px 8px;border-radius:2px;letter-spacing:.06em}

.acc-tag.off{color:var(--faint);border:1px dashed var(--faint)}
.lt2{color:var(--faint);font-size:12px}

.mini-dots{display:inline-flex;gap:4px}

.op-btns{display:flex;gap:6px}
.batch-bar{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%);z-index:40;display:flex;gap:12px;align-items:center;background:#10101aee;border:1px solid var(--gold);border-radius:6px;padding:12px 20px;backdrop-filter:blur(6px);box-shadow:0 14px 40px rgba(0,0,0,.6);flex-wrap:wrap;justify-content:center;max-width:92vw}

.stepper{display:flex;align-items:center;gap:8px}

.danger-zone .dz-t{color:#d98a92;font-size:13px;letter-spacing:.14em;margin-right:auto}
.t-note{font-size:12px;color:var(--faint);letter-spacing:.1em;margin:12px 0;line-height:1.8}
.prob-box{border:1px solid var(--gold-dim);border-radius:5px;padding:16px 20px;margin:14px 0}

.prob-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--dim);border-bottom:1px solid rgba(212,171,90,.1);gap:14px;flex-wrap:wrap}

.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}

.medal.m2{background:#c0c6d4;color:#1a2230}
.medal.m3{background:#c98a5a;color:#2a1a08}
.rankn{color:var(--dim);min-width:27px;display:inline-block;text-align:center}
.ar-note{font-size:12px;color:var(--dim);line-height:1.9;letter-spacing:.04em;border:1px dashed var(--gold-dim);border-radius:4px;padding:10px 12px}
.ar-row{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px dashed rgba(212,171,90,.22);flex-wrap:wrap}
.ar-row:last-child{border-bottom:none}
.ar-info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:200px}
.ar-info b{font-size:15px;color:var(--gold-hi)}
.ar-info span{font-size:12px;color:var(--dim);word-break:break-all;white-space:normal}

<script>

  {k:'sr_jian',  r:'SR', n:'轻简符',   g:'简', h:170, rw:'作业减半×1',            lore:'笔下山减半，夜色早归人。'},
  {k:'r_xia',    r:'R',  n:'流霞酿',   g:'霞', h:8,   rw:'可乐一瓶',              lore:'一瓶流霞，微甜微凉。'},
  {k:'r_yuan',   r:'R',  n:'空谷音',   g:'缘', h:150, rw:'谢谢惠顾',              lore:'星光暂敛，来日方长。'},
  {k:'r_kuan',   r:'R',  n:'宽宥帖',   g:'宽', h:100, rw:'免罚一次',              lore:'小过可宥，下不为例。'},
  {k:'r_jin',    r:'R',  n:'锦鲤符',   g:'锦', h:320, rw:'好运贴纸×1',            lore:'锦鲤附身，好运常伴。'},
  {k:'r_he',     r:'R',  n:'和风帖',   g:'和', h:75,  rw:'水果加餐×1',            lore:'一枚鲜果，和风入喉。'},
  {k:'r_ling',   r:'R',  n:'灵思符',   g:'灵', h:185, rw:'课堂提问优先×1',        lore:'灵光先至，答问争先。'},
  {k:'r_mo',     r:'R',  n:'墨宝缘',   g:'墨', h:260, rw:'手写书签×1',            lore:'一字一笺，皆出师手。'},
  {k:'r_mian',   r:'R',  n:'小憩符',   g:'憩', h:230, rw:'课间小憩五分钟',        lore:'伏案五刻，梦亦香甜。'},
  {k:'r_xing',   r:'R',  n:'启明符',   g:'启', h:65,  rw:'值日班长体验×1',        lore:'一日为官，方知班务。'},
  {k:'r_song',   r:'R',  n:'清音令',   g:'清', h:140, rw:'课间点歌×1',            lore:'一曲清音，散尽倦意。'}
];
const PM=Object.fromEntries(POOL.map(c=>[c.k,c]));
const RN={SP:'神迹',SSR:'稀世',SR:'珍宝',R:'凡星'};
const R_ALL=['SP','SSR','SR','R'];
const LUCK={SP:1000,SSR:200,SR:50,R:2};
const CMP_TYPES=['概率异常','系统故障','学号被抢注','其他'];
const rarCount=r=>POOL.filter(c=>c.r===r).length;

/* ==================== 云同步 ==================== */
const CKEY='zxl_cloud_cfg', SKEY='zxl_session', MKEY='zxl_mute', BKEY='zxl_bg';
function readJSON(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
const CLOUD={
  cfg:readJSON(CKEY)||null,
  sha:null, busy:false, pending:false, timer:null,
  state:{mode:'off',text:''},
  enabled(){return !!(this.cfg&&this.cfg.owner&&this.cfg.repo&&this.cfg.token);},
  api(){const c=this.cfg;return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(c.path||'data.json')}?ref=${encodeURIComponent(c.branch||'main')}`;},
  hdr(){return {Authorization:'Bearer '+this.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};},
  encode(s){return btoa(unescape(encodeURIComponent(s)));},
  decode(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))));}
};
function cloudMark(mode,text){CLOUD.state={mode,text};updateCloudStrips();}
function updateCloudStrips(){
  document.querySelectorAll('.cloud-strip[data-live]').forEach(el=>{
    el.className='cloud-strip'+(CLOUD.state.mode==='ok'?' ok':CLOUD.state.mode==='err'?' err':'');
    el.innerHTML=`☁ ${CLOUD.state.text||'本机模式 · 数据仅存于此设备'}`;
  });
}
function cloudStripHTML(extra){
  const t=CLOUD.state.text||(CLOUD.enabled()?'连接中…':'本机模式 · 数据仅存于此设备');
  return `<span data-live>☁ ${t}</span>${extra||''}`;
}
async function ghFetch(url,opt){
  const c=opt||{};
  return fetch(url,{method:c.method||'GET',headers:CLOUD.hdr(),body:c.body?JSON.stringify(c.body):undefined});
}
async function cloudPull(){
  if(!CLOUD.enabled())return null;
  try{
    const r=await ghFetch(CLOUD.api());
    if(r.status===404)return{empty:true};
    if(!r.ok)return{err:'HTTP '+r.status};
    const j=await r.json();
    CLOUD.sha=j.sha;
    return{data:JSON.parse(CLOUD.decode(j.content))};
  }catch(e){return{err:'网络异常'};}
}
function cloudPayload(){
  const o=JSON.parse(JSON.stringify(DB));
  o.students.forEach(s=>delete s.editing);
  o.updatedAt=Date.now();
  return o;
}
async function cloudDoPush(){
  if(!CLOUD.enabled())return;
  if(CLOUD.busy){CLOUD.pending=true;return;}
  CLOUD.busy=true;
  try{
    const payload=cloudPayload();
    const body={message:'摘星录数据同步 '+new Date().toLocaleString('zh-CN'),
      content:CLOUD.encode(JSON.stringify(payload,null,2)),branch:CLOUD.cfg.branch||'main'};
    if(CLOUD.sha)body.sha=CLOUD.sha;
    let r=await ghFetch(CLOUD.api(),{method:'PUT',body});
    if(r.status===409||r.status===422){
      await cloudPull();
      if(CLOUD.sha){body.sha=CLOUD.sha;r=await ghFetch(CLOUD.api(),{method:'PUT',body});}
    }
    if(r.ok){
      const j=await r.json();CLOUD.sha=j.content.sha;
      DB.updatedAt=payload.updatedAt;saveLocal();
      cloudMark('ok','云端已同步 '+new Date().toLocaleTimeString('zh-CN',{hour12:false}));
    }else if(r.status===401||r.status===403){cloudMark('err','同步失败：密钥无效或无写入权限（数据已存本机）');}
    else cloudMark('err','同步失败 HTTP '+r.status+'（数据已存本机）');
  }catch(e){cloudMark('err','网络异常 · 已存本机，恢复后自动补传');}
  finally{
    CLOUD.busy=false;
    if(CLOUD.pending){CLOUD.pending=false;setTimeout(cloudDoPush,300);}
  }
}
function cloudQueue(){if(!CLOUD.enabled())return;clearTimeout(CLOUD.timer);cloudMark('on','同步中…');CLOUD.timer=setTimeout(cloudDoPush,1200);}
async function cloudStartup(){
  if(!CLOUD.enabled()){cloudMark('off','');return;}
  cloudMark('on','正在连接云端…');
  const r=await cloudPull();
  if(!r){cloudMark('err','连接失败 · 暂用本机数据');return;}
  if(r.empty){await cloudDoPush();return;}
  if(r.err){cloudMark('err','读取失败('+r.err+') · 暂用本机数据');return;}
  const remote=r.data;
  if(remote&&Array.isArray(remote.students)&&remote.students.length===50){
    if((remote.updatedAt||0)>=(DB.updatedAt||0)){applyRemote(remote);cloudMark('ok','已载入云端数据（'+((remote.updatedAt?new Date(remote.updatedAt):new Date()).toLocaleString('zh-CN'))+'）');}
    else await cloudDoPush();
  }else{await cloudDoPush();}
}
function applyRemote(o){
  DB=normalizeDB(o);
  saveLocal();
  const sess=parseInt(localStorage.getItem(SKEY));
  if(sess&&(!DB.accounts[String(sess)])){localStorage.removeItem(SKEY);state.sid=null;if(state.screen==='stu'){state.screen='home';}}
  render();
}

/* ==================== 数据层 ==================== */
const KEY='zhaixinglu_v4';
const RATES_DEFAULT={sp:1,ssrMin:5,ssrMax:10,srMin:20,srMax:30};
const CODE_CHARS='ACDEFHJKLMNPQRTUVWXY3456789';
function hashPwd(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0).toString(36)+'.'+s.length.toString(36));}
function genCode(db){
  db=db||DB;
  const used=new Set();
  db.students.forEach(s=>(s.rewards||[]).forEach(r=>used.add(r.code)));
  let c;
  do{c=Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');}while(used.has(c));
  return c;
}
function freshStats(){
  return {since:Date.now(),seeded:false,sessions:0,singles:0,fives:0,tens:0,
    cards:{SP:0,SSR:0,SR:0,R:0},gura:0,spentB:0,spentFree:0,freeGain:0};
}
function initDB(){
  return { pwd:'1234', spDrawn:false, archives:[], rates:{...RATES_DEFAULT},
    stats:freshStats(), accounts:{}, complaints:[], updatedAt:0,
    students:Array.from({length:50},(_,i)=>({id:i+1,name:'',a:0,b:0,free:0,nSessions:0,cards:{},hist:[],rewards:[]})) };
}
function sanitize(db){
  db.students.forEach(s=>{
    if(typeof s.name!=='string')s.name='';
    s.a=+s.a||0;s.b=+s.b||0;s.free=+s.free||0;
    s.cards=(s.cards&&typeof s.cards==='object')?s.cards:{};
    s.hist=Array.isArray(s.hist)?s.hist:[];
    s.rewards=Array.isArray(s.rewards)?s.rewards:[];
    s.nSessions=+s.nSessions||s.hist.length||0;
    s.editing=false;
  });
  if(typeof db.pwd!=='string'||!db.pwd)db.pwd='1234';
  if(typeof db.spDrawn!=='boolean')db.spDrawn=false;
  if(!Array.isArray(db.archives))db.archives=[];
  if(!db.accounts||typeof db.accounts!=='object')db.accounts={};
  for(const k in db.accounts){const a=db.accounts[k];if(!a||typeof a.h!=='string')delete db.accounts[k];}
  if(!Array.isArray(db.complaints))db.complaints=[];
  db.complaints=db.complaints.filter(c=>c&&typeof c.text==='string').slice(0,60);
  if(typeof db.updatedAt!=='number')db.updatedAt=0;
  if(!db.rates||typeof db.rates!=='object')db.rates={...RATES_DEFAULT};
  const R=db.rates;
  const num=(v,d,lo,hi)=>{v=+v;return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
  R.sp=num(R.sp,1,0,5);
  R.ssrMin=num(R.ssrMin,5,0.5,15);
  R.ssrMax=num(R.ssrMax,10,1,15);
  R.srMin=num(R.srMin,20,5,50);
  R.srMax=num(R.srMax,30,10,50);
  if(!(R.ssrMax>R.ssrMin)){R.ssrMin=5;R.ssrMax=10;}
  if(!(R.srMax>R.srMin)){R.srMin=20;R.srMax=30;}
  if(R.sp+R.ssrMin+R.srMin>95){db.rates={...RATES_DEFAULT};}
  const okStats=db.stats&&db.stats.cards&&typeof db.stats.cards==='object';
  if(!okStats){db.stats=freshStats();}
  else{
    const st=db.stats;
    ['SP','SSR','SR','R'].forEach(r=>{if(typeof st.cards[r]!=='number')st.cards[r]=0;});
    ['sessions','singles','fives','tens','gura','spentB','spentFree','freeGain'].forEach(k=>{if(typeof st[k]!=='number')st[k]=0;});
    if(typeof st.since!=='number')st.since=Date.now();
    if(typeof st.seeded!=='boolean')st.seeded=false;
  }
  return db;
}
function normalizeDB(o){
  const db=initDB();
  if(o&&Array.isArray(o.students)&&o.students.length===50){
    db.students.forEach((s,i)=>{
      const os=o.students[i]||{};
      s.name=typeof os.name==='string'?os.name:'';
      s.a=+os.a||0;s.b=+os.b||0;s.free=+os.free||0;
      s.cards=(os.cards&&typeof os.cards==='object')?os.cards:{};
      s.hist=Array.isArray(os.hist)?os.hist:[];
      s.nSessions=+os.nSessions||s.hist.length;
      if(Array.isArray(os.rewards)){s.rewards=os.rewards;}
      else{
        s.rewards=[];
        for(const k in s.cards){const n=s.cards[k]|0;for(let j=0;j<n;j++)if(k!=='r_yuan')s.rewards.push({code:genCode(db),k,st:'pend',t:Date.now()});}
      }
    });
    db.pwd=(typeof o.pwd==='string'&&o.pwd)?o.pwd:'1234';
    db.spDrawn=!!o.spDrawn;
    db.archives=Array.isArray(o.archives)?o.archives:[];
    if(o.accounts&&typeof o.accounts==='object')db.accounts=o.accounts;
    if(Array.isArray(o.complaints))db.complaints=o.complaints;
    if(o.rates&&typeof o.rates==='object')db.rates={...RATES_DEFAULT,...o.rates};
    if(o.stats&&o.stats.cards){db.stats=JSON.parse(JSON.stringify(o.stats));}
    else{
      db.stats=freshStats();db.stats.seeded=true;
      let minT=Infinity;
      db.students.forEach(s=>{
        for(const k in s.cards){const c=PM[k];if(c)db.stats.cards[c.r]+=(s.cards[k]|0);}
        db.stats.sessions+=s.hist.length;
        s.hist.forEach(h=>{if(h&&h.t&&h.t<minT)minT=h.t;});
      });
      if(minT<Infinity)db.stats.since=minT;
    }
    db.updatedAt=+o.updatedAt||0;
  }
  return sanitize(db);
}

const SFX={
  ctx:null,
  ensure(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch(e){}return this.ctx;},
  t(o){
    if(localStorage.getItem(MKEY)==='1')return;const c=this.ensure();if(!c)return;
    const{f=440,f2=0,dur=.18,type='sine',vol=.12,at=0,attack=.01}=o;
    const t0=c.currentTime+at;
    const osc=c.createOscillator(),g=c.createGain();
    osc.type=type;osc.frequency.setValueAtTime(f,t0);
    if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0);osc.stop(t0+dur+.08);
  },
  n(o){
    if(localStorage.getItem(MKEY)==='1')return;const c=this.ensure();if(!c)return;
    const{dur=.12,vol=.06,at=0,hp=900,lp=8000}=o;
    const t0=c.currentTime+at;
    const len=Math.max(1,Math.floor(c.sampleRate*dur)),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=(hp+lp)/2;f.Q.value=.6;
    const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(f).connect(g).connect(c.destination);src.start(t0);
  },
  click(){this.t({f:640,dur:.045,type:'triangle',vol:.035});},
  r(){this.t({f:659,dur:.15,type:'triangle',vol:.08});this.t({f:988,at:.06,dur:.18,type:'sine',vol:.05});},
  sr(){[587,740,880].forEach((f,i)=>this.t({f,at:i*.07,dur:.22,type:'triangle',vol:.09}));},
  ssr(){[392,494,587,784].forEach((f,i)=>this.t({f,at:i*.08,dur:.3,type:'triangle',vol:.1}));this.t({f:1568,at:.34,dur:.5,type:'sine',vol:.07});this.n({dur:.5,vol:.03,hp:4000,lp:9000});},
  summon(){this.t({f:130,f2:88,dur:.85,type:'sine',vol:.06});this.n({dur:.7,vol:.025,hp:500,lp:3000});},
  spPre(){this.t({f:110,f2:880,dur:1.1,type:'sawtooth',vol:.05});this.t({f:220,f2:1760,dur:1.1,type:'sine',vol:.04});},
  comet(){this.t({f:1800,f2:220,dur:.9,type:'sine',vol:.07});},
  impact(){this.t({f:70,f2:36,dur:.7,type:'sine',vol:.22});this.n({dur:.4,vol:.12,hp:200,lp:3000});},
  chord(){[523,659,784,1046].forEach((f,i)=>this.t({f,at:i*.12,dur:.8,type:'triangle',vol:.09}));this.n({dur:.9,vol:.04,hp:5000,lp:10000});},
  bell(){this.t({f:1318,dur:.5,type:'sine',vol:.09});this.t({f:1975,at:.1,dur:.45,type:'sine',vol:.05});},
  stamp(){this.t({f:160,f2:60,dur:.15,type:'square',vol:.08});this.n({dur:.08,vol:.05,hp:300,lp:1500});},
  err(){this.t({f:220,f2:140,dur:.22,type:'sawtooth',vol:.06});},
  coin(){this.t({f:988,dur:.09,type:'square',vol:.05});this.t({f:1318,at:.07,dur:.25,type:'triangle',vol:.08});},
  whoosh(){this.n({dur:.5,vol:.09,hp:350,lp:5200});this.t({f:200,f2:640,dur:.42,type:'sine',vol:.05});}
};

/* ==================== 章系统 / 抽卡引擎 ==================== */
function addA(id,n){
  const s=DB.students[id-1];
  s.a+=n;
  const g=Math.floor(s.a/10);
  if(g>0){s.a-=g*10;s.b+=g;}
  save();
  return g;
}
function rollOne(spUsed){
  const R=DB.rates;
  const sp=(DB.spDrawn||spUsed)?0:(R.sp/100);
  const ssr=(R.ssrMin+Math.random()*(R.ssrMax-R.ssrMin))/100;
  const sr=(R.srMin+Math.random()*(R.srMax-R.srMin))/100;
  const r=Math.random();
  let acc=sp; if(r<acc)return pick('SP');
  acc+=ssr; if(r<acc)return pick('SSR');
  acc+=sr; if(r<acc)return pick('SR');
  return pick('R');
}
function pick(rar){
  const p=POOL.filter(c=>c.r===rar);
  return p[Math.floor(Math.random()*p.length)].k;
}
function rollMany(n,guarantee){
  const out=[];let spUsed=false;
  for(let i=0;i<n;i++){const k=rollOne(spUsed);if(PM[k].r==='SP')spUsed=true;out.push(k);}
  let gura=false;
  if(guarantee&&!out.some(k=>PM[k].r!=='R')){out[n-1]=pick('SR');gura=true;}
  return{list:out,gura};
}
async function tryDraw(tier){
  if(stageOpen)return;
  const s=DB.students[state.sid-1];
  const need={1:1,5:4,10:9}[tier];
  const useFree=(tier===1&&s.free>0);
  const okTxt=useFree?'消耗 1 次免费摘星':'消耗 B章 ×'+need;
  const ok=await modal({title:tier===1?'摘取一签':tier+' 连摘星',
    body:`即将 ${okTxt}，摘取 ${tier} 张星卡。${tier===10?'<br>十连含保底：必得一张珍宝（SR）以上。':''}<div class="m-hint">当前：A ${s.a} · B ${s.b} · 免抽 ${s.free}</div>`,
    okText:'启 动 摘 星 阵'});
  if(!ok)return;
  doDraw(tier);
}
function doDraw(tier){
  const s=DB.students[state.sid-1];
  const need={1:1,5:4,10:9}[tier];
  let cost;
  if(tier===1){
    if(s.free>0){s.free--;cost={free:1};}
    else if(s.b>=1){s.b--;cost={b:1};}
    else{SFX.err();toast('章印不足，先攒够再来','warn');return;}
  }else{
    if(s.b<need){SFX.err();toast('B章不足 '+need+' 枚','warn');return;}
    s.b-=need;cost={b:need};
  }
  const {list:results,gura}=rollMany(tier,tier===10);
  let freeGain=0,spHit=false;
  const newCodes=[];
  results.forEach(k=>{
    s.cards[k]=(s.cards[k]|0)+1;
    DB.stats.cards[PM[k].r]++;
    if(PM[k].r==='SP'){DB.spDrawn=true;spHit=true;}
    if(k==='ssr_shi')freeGain+=2;
    if(k==='sr_yao')freeGain+=1;
    if(k!=='r_yuan'){const code=genCode();s.rewards.push({code,k,st:'pend',t:Date.now()});newCodes.push({code,k});}
  });
  s.free+=freeGain;
  s.hist.unshift({t:Date.now(),cost,res:results});
  if(s.hist.length>30)s.hist.pop();
  s.nSessions++;
  DB.stats.sessions++;
  if(tier===1)DB.stats.singles++;else if(tier===5)DB.stats.fives++;else DB.stats.tens++;
  if(gura)DB.stats.gura++;
  DB.stats.spentB+=cost.b||0;
  DB.stats.spentFree+=cost.free||0;
  DB.stats.freeGain+=freeGain;
  save();
  playDraw(results,{tier,cost,freeGain,spHit,gura,newCodes});
}

    if(r==='R')SFX.r();else if(r==='SR')SFX.sr();else if(r==='SSR')SFX.ssr();else SFX.chord();
  },300);
  flippedN++;
  if(flippedN>=totalN){clearTimeout(autoTimer);setTimeout(()=>{if(tok===stageToken&&stageDone){stageDone();stageDone=null;}},single?1400:850);}
}
async function flipAll(){
  const tok=++seqToken;
  const cards=[...stageEl.querySelectorAll('.card:not(.flipped)')];
  const hint=stageEl.querySelector('.st-hint');
  if(cards.length>1&&hint)hint.textContent='星 轨 快 闪 …';
  for(const c of cards){
    if(tok!==seqToken)return;
    onFlip(c,true);
    const r=c.dataset.r;
    if(r==='SP')await sleep(1800);
    else if(r==='SSR')await sleep(620);
    else if(r==='SR')await sleep(340);
    else await sleep(160);
  }
}
function closeStage(){

/* ==================== 特效 ==================== */
function fxE(cls,css){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css||{});fxEl.appendChild(d);return d;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function ambient(r,strong){
  if(r==='SSR'||r==='SP'){
    const nb=fxE('fx-neb');
    nb.style.setProperty('--no',r==='SP'?'.65':'.45');
    nb.style.animationDuration=r==='SP'?'2s':'1.3s';
    setTimeout(()=>nb.remove(),r==='SP'?2300:1500);
  }
  const m={R:['92,184,154',.10],SR:['224,92,110',.15],SSR:['242,193,78',.2],SP:['246,217,138',.28]}[r];
  if(!m)return;
  if(r==='R'&&!strong)return;
  const d=fxE('fx-amb');
  d.style.background=`radial-gradient(circle at 50% 45%, transparent 28%, rgba(${m[0]},${(strong?m[1]*1.5:m[1]).toFixed(2)}) 125%)`;
  d.style.setProperty('--ao',String(Math.min(.5,strong?m[1]*2.2:m[1])));
  setTimeout(()=>d.remove(),1200);
}
function converge(n){
  const cx=innerWidth/2,cy=innerHeight*0.44;
  for(let i=0;i<n;i++){
    const ang=Math.random()*6.283,R=Math.hypot(cx,cy)+90;
    const x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    const d=fxE('fx-dot',{left:x+'px',top:y+'px'});
    d.getBoundingClientRect();
    d.style.transition=`transform ${620+Math.random()*380}ms cubic-bezier(.45,0,.7,.4),opacity ${500+Math.random()*300}ms`;
    d.style.transform=`translate(${cx-x}px,${cy-y}px) scale(.2)`;
    d.style.opacity='0';
    setTimeout(()=>d.remove(),1150);
  }
}
function ring(x,y,color,size,delay=0){
  setTimeout(()=>{
    const d=fxE('fx-ring',{left:x+'px',top:y+'px',width:size+'px',height:size+'px',borderColor:color});
    d.addEventListener('animationend',()=>d.remove());
    setTimeout(()=>d.remove(),1400);
  },delay);
}
function rays(x,y,n,color){
  const w=fxE('fx-rays',{left:x+'px',top:y+'px'});
  for(let i=0;i<n;i++){const r=document.createElement('i');r.style.setProperty('--r',(i*360/n)+'deg');r.style.setProperty('--rc',color);w.appendChild(r);}
  setTimeout(()=>w.remove(),900);
}
function sparks(x,y,n,color,dist=120){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,d=dist*(.4+Math.random()*.85);
    const s=fxE('fx-sp',{left:x+'px',top:y+'px',background:color,
      '--tx':Math.cos(a)*d+'px','--ty':Math.sin(a)*d+'px'});
    s.style.animationDelay=(Math.random()*.12)+'s';
    setTimeout(()=>s.remove(),1100);
  }
}
function starfall(n){
  for(let i=0;i<n;i++){
    const sz=2+Math.random()*3;
    const d=fxE('fx-fall',{left:(Math.random()*100)+'vw',width:sz+'px',height:sz+'px',
      animationDuration:(.9+Math.random()*.9)+'s',animationDelay:(Math.random()*.9)+'s'});
    setTimeout(()=>d.remove(),2400);
  }
}
function spShow(x,y){
  fxE('fx-aurora');
  document.body.classList.add('quake');
  setTimeout(()=>document.body.classList.remove('quake'),600);
  starfall(48);
  rays(x,y,16,'#f6d98a');sparks(x,y,42,'#ffe9b0',190);
  ring(x,y,'rgba(246,217,138,.95)',240);
  ring(x,y,'rgba(255,255,255,.85)',330,140);
}
function burst(x,y,r){
  if(r==='R'){ring(x,y,'rgba(92,184,154,.75)',120);}
  else if(r==='SR'){ring(x,y,'rgba(224,92,110,.9)',160);ring(x,y,'rgba(224,92,110,.4)',250,90);sparks(x,y,16,'#e8859b',130);}
  else if(r==='SSR'){rays(x,y,12,'#f2c14e');ring(x,y,'rgba(242,193,78,.9)',180);sparks(x,y,26,'#f2df9d',150);}
  else if(r==='SP'){spShow(x,y);}
}

/* ==================== 星空背景 ==================== */
const sky=document.getElementById('sky'),sctx=sky.getContext('2d');
let stars=[];
function skyInit(){
  sky.width=innerWidth;sky.height=innerHeight;
  stars=Array.from({length:120},()=>{
    const c=Math.random();
    return {x:Math.random()*sky.width,y:Math.random()*sky.height,
      r:.4+Math.random()*1.3,tw:Math.random()*6.28,sp:.008+Math.random()*.02,
      col:c<.66?'240,230,200':(c<.88?'242,218,150':'168,200,255')};
  });
}
let meteor=null,meteorT=0;
function skyLoop(){
  sctx.clearRect(0,0,sky.width,sky.height);
  for(const s of stars){
    s.tw+=s.sp;
    const a=.2+.55*(Math.sin(s.tw)*.5+.5);
    sctx.fillStyle=`rgba(${s.col},${a})`;
    sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,6.28);sctx.fill();
  }
  meteorT--;
  if(meteorT<=0&&!meteor){meteor={x:Math.random()*sky.width*.8+sky.width*.1,y:Math.random()*sky.height*.3,vx:-5-Math.random()*3,vy:3+Math.random()*2,life:34};meteorT=380+Math.random()*520;}
  if(meteor){
    sctx.strokeStyle='rgba(242,223,157,.7)';sctx.lineWidth=1.4;
    sctx.beginPath();sctx.moveTo(meteor.x,meteor.y);
    sctx.lineTo(meteor.x-meteor.vx*6,meteor.y-meteor.vy*6);sctx.stroke();
    meteor.x+=meteor.vx;meteor.y+=meteor.vy;meteor.life--;
    if(meteor.life<=0)meteor=null;
  }
  requestAnimationFrame(skyLoop);
}
skyInit();window.addEventListener('resize',skyInit);skyLoop();

        SFX.err();
        const ok=await modal({title:'学号已被注册',danger:true,okText:'去投诉申诉',cancelText:'我知道了',
          body:`学号 <b>${n}</b> 已被注册。若是他人冒用你的学号，可提交「学号被抢注」投诉，班主任核实后会为其重置。`});
        if(ok){openComplaint();}
        return;}
      DB.accounts[String(n)]={h:hashPwd(pw),t:Date.now()};
      localStorage.setItem(SKEY,n);
      save();
      state.sid=n;state.screen='stu';state.tab='book';SFX.bell();
      toast('注册成功 · 欢迎入阁','ok');render();break;}
    case 'stu-logout':
      localStorage.removeItem(SKEY);state.sid=null;state.screen='home';
      SFX.click();toast('已退出本设备登录');render();break;
    case 'tea-go':{
      if($('#tea-pwd').value===DB.pwd){state.screen='tea';state.ttab='roster';SFX.bell();render();}
      else{const b=$('#tea-box');b.classList.remove('shakex');void b.offsetWidth;b.classList.add('shakex');SFX.err();toast('密令有误','warn');}
      break;}
    case 'snd':{
      const off=localStorage.getItem(MKEY)==='1';
      localStorage.setItem(MKEY,off?'0':'1');syncSnd();if(off)SFX.bell();break;}
    case 'tab': state.tab=v;render();break;
    case 'ttab': state.ttab=v;render();break;
    case 'filter': state.filter=v;render();break;
    case 'draw': tryDraw(parseInt(v));break;
    case 'flip': onFlip(t,false);break;
    case 'flip-all': t.disabled=true;flipAll();break;
    case 'skip': closeStage();render();toast('所得星卡已收入卡册');break;
    case 'collect':{
      const wasSp=stageEl.querySelector('.card[data-r="SP"].flipped');
      SFX.coin();closeStage();render();
      if(wasSp)toast('文曲星已被摘下 · 全班唯一','ok');
      else toast('星卡已收入卡册','ok');break;}
    case 'again':{
      const tier=parseInt(v);closeStage();
      setTimeout(()=>doDraw(tier),280);break;}
    case 'show-codes': if(lastMeta&&lastMeta.newCodes.length)openCodesModal(lastMeta.newCodes);break;
    case 'card-detail': openCardDetail(v);break;
    case 'card-locked': SFX.err();toast('缘分未至 · 先去攒章摘星吧','warn');break;
    case 'cmp-open': openComplaint();break;
    case 'cmp-done':{
      const c=DB.complaints.find(x=>x.id===Number(t.dataset.cid));
      if(c){c.st='done';c.tDone=Date.now();save();SFX.coin();toast('已标记处理完毕','ok');render();}
      break;}
    case 'cmp-del':{
      const c=DB.complaints.find(x=>x.id===Number(t.dataset.cid));
      if(c){const ok=await modal({title:'删除投诉',danger:true,okText:'删 除',body:`删除 ${String(c.sid).padStart(2,'0')} 号的投诉（${esc(CMP_TYPES[c.type]||'其他')}）？`});
        if(ok){DB.complaints=DB.complaints.filter(x=>x.id!==c.id);save();toast('已删除');render();}}
      break;}
    case 'cloud-setup': openCloudSetup();break;
    case 'cloud-pull':{
      if(!CLOUD.enabled()){toast('尚未配置云端 · 请先「配置同步」','warn');break;}
      toast('正在拉取云端…');
      const r=await cloudPull();
      if(r&&r.data&&r.data.students){applyRemote(r.data);toast('已载入云端最新数据','ok');if(state.screen==='tea')render();}
      else if(r&&r.empty){toast('云端暂无数据 · 可点「推送本机」上传','warn');}
      else toast('拉取失败：'+((r&&r.err)||'未知错误'),'warn');
      break;}
    case 'cloud-push':
      if(!CLOUD.enabled()){toast('尚未配置云端 · 请先「配置同步」','warn');break;}
      toast('正在推送本机数据…');await cloudDoPush();break;
    case 'cloud-off':{
      const ok=await modal({title:'断开云端',danger:true,okText:'断 开',body:'断开后本设备回到「本机模式」，数据保留在本机；其他设备不受影响。'});
      if(!ok)break;
      CLOUD.cfg=null;localStorage.removeItem(CKEY);CLOUD.sha=null;
      cloudMark('off','');SFX.click();toast('已断开云端');render();break;}
    case 'bg-upload':{$('#bg-file').click();break;}
    case 'bg-clear':
      localStorage.removeItem(BKEY);applyCustomBG();
      SFX.bell();toast('已恢复默认程序化星空');render();break;
    case 'rates-save':{
      const g=s=>{const el=$(s);return el?parseFloat(el.value):NaN;};
      const sp=g('#rt-sp'),a1=g('#rt-a1'),a2=g('#rt-a2'),b1=g('#rt-b1'),b2=g('#rt-b2');
      let err='';
      if(isNaN(sp)||sp<0||sp>5)err='SP 需在 0 – 5 之间';
      else if(isNaN(a1)||isNaN(a2)||a1<0.5||a2>15||a2<=a1)err='SSR 需满足 0.5 ≤ 下限 < 上限 ≤ 15';
      else if(isNaN(b1)||isNaN(b2)||b1<5||b2>50||b2<=b1)err='SR 需满足 5 ≤ 下限 < 上限 ≤ 50';
      else if(sp+a1+b1>95)err='下限之和过大 · 需给凡星 R 至少留 5%';
      if(err){SFX.err();toast(err,'warn');break;}
      DB.rates={sp,ssrMin:a1,ssrMax:a2,srMin:b1,srMax:b2};
      save();SFX.coin();toast('星轨已暗改 · 即刻生效'+(CLOUD.enabled()?' · 已同步云端':''),'ok');render();break;}
    case 'rates-reset':
      DB.rates={...RATES_DEFAULT};save();SFX.bell();toast('星轨已恢复默认');render();break;
    case 'a-add':{
      const g=addA(+id,+t.dataset.n);
      SFX.stamp();if(g)setTimeout(()=>SFX.bell(),160);
      toast(`已为 ${esc(nameOf(S))} 盖 A章 +${t.dataset.n}${g?` · ${g} 枚进阶 B 章`:''}`,g?'ok':'');
      render();break;}
    case 'b-adj':{
      const n=+t.dataset.n;
      if(S.b+n<0){SFX.err();toast('B章不能为负','warn');return;}
      S.b+=n;save();toast(`${esc(nameOf(S))} B章 ${n>0?'+':''}${n}`);render();break;}
    case 'name-edit': S.editing=true;render();
      setTimeout(()=>{const i=document.querySelector(`input[data-name="${id}"]`);if(i)i.focus();},30);break;
    case 'acc-reset':{
      const acc=DB.accounts[String(id)];
      if(!acc)break;
      const ok=await modal({title:'重置学号密令',danger:true,okText:'重 置',
        body:`学号 <b>${id}</b> 的注册将被清除，该同学可在任意设备重新注册。<br>适用于：忘密 / 换人 / 学号被抢注申诉。`});
      if(!ok)break;
      delete DB.accounts[String(id)];
      if(state.sid===id){localStorage.removeItem(SKEY);}
      save();SFX.stamp();toast(`学号 ${id} 已重置 · 可重新注册`,'ok');render();break;}
    case 'batch': state.batch=!state.batch;state.ids.clear();render();break;
    case 'bn': state.batchN=Math.min(10,Math.max(1,state.batchN+ +t.dataset.n));render();break;
    case 'batch-send':{
      if(!state.ids.size){SFX.err();toast('请先勾选学生','warn');return;}
      let g=0;
      state.ids.forEach(i=>g+=addA(i,state.batchN));
      SFX.stamp();if(g)setTimeout(()=>SFX.bell(),160);
      toast(`已为 ${state.ids.size} 人各发 A章 +${state.batchN}${g?` · 共 ${g} 枚进阶 B 章`:''}`,'ok');
      state.ids.clear();render();break;}
    case 'pwd': openPwdChange();break;
    case 'export':
      dlJSON(DB,'摘星录备份.json');
      SFX.coin();toast('备份已导出（含注册/投诉/暗改/归档）','ok');break;
    case 'import':{$('#imp-file').click();break;}
    case 'archive': openArchiveMgr();break;
    case 'reset':{
      const ok1=await modal({title:'重置一切数据',danger:true,okText:'仍要重置',
        body:`将清空<b>所有</b>章印、卡册、兑换、统计、<b>学生注册账号</b>与投诉，${CLOUD.enabled()?'并重置<b>云端数据</b>；':''}文曲星重新待出。<div class="m-hint">学期归档将保留；如需彻底清空请先删除归档。</div>`});
      if(!ok1)break;
      const ok2=await modal({title:'最后确认',danger:true,okText:'抹 去',body:'五十人的一切星轨即将归零，确定？'});
      if(!ok2)break;
      const keep=DB.archives;
      DB=initDB();DB.archives=keep;save();
      localStorage.removeItem(SKEY);state.sid=null;state.ids.clear();
      SFX.impact();render();toast('已归于混沌（一切数据已重置）','warn');break;}
    case 'redeem': await doRedeem(t.dataset.code);break;
    case 'redeem-quick':{
      const val=($('#rd-code')?$('#rd-code').value:'').trim().toUpperCase();
      if(!/^[A-Z0-9]{4}$/.test(val)){SFX.err();toast('兑换码为 4 位字母/数字','warn');break;}
      await doRedeem(val);break;}
    case 'ar-close': closeModal();break;
    case 'ar-create': openArchiveCreate();break;
    case 'ar-confirm':{
      const nm=($('#ar-name')?$('#ar-name').value:'').trim()||'未命名学期';
      const keep=$('#ar-keep')?$('#ar-keep').checked:true;
      const ok=await modal({title:'最终确认',danger:true,okText:'确 认 封 存',body:`即将归档「${esc(nm)}」并清零当前学期数据，<b style="color:#f0a8ae">封存内容不可再修改</b>。`});
      if(!ok)break;
      doArchive(nm,keep);break;}
    case 'ar-export':{
      const a=DB.archives.find(x=>x.id===Number(t.dataset.aid));
      if(a){dlJSON(a,`摘星录归档-${a.name}.json`);SFX.coin();toast('归档已导出','ok');}
      break;}
    case 'ar-del': await deleteArchiveFlow(Number(t.dataset.aid));break;
  }
});
document.addEventListener('click',e=>{
  const ct=e.target.closest('.cd-codes .code-txt');
  if(!ct)return;
  const box=ct.closest('.m-box');
  const card=box?box.querySelector('.card[data-key]'):null;
  const k=card?card.dataset.key:null;
  modal({title:'出 示 此 码',body:`<div style="text-align:center;padding:8px 0 4px"><span class="code-txt" style="font-size:30px;padding:14px 20px 14px 30px">${esc(ct.textContent.trim())}</span></div>`,okText:'好 的',cancelText:''}).then(()=>{
    if(k&&state.screen==='stu')openCardDetail(k);
  });
});
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.card,[data-act]'))e.preventDefault();
});
document.addEventListener('focusout',e=>{
  const i=e.target.closest('input[data-name]');
  if(!i)return;
  const s=DB.students[+i.dataset.name-1];
  s.name=i.value.trim();s.editing=false;save();render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const mc=$('#m-cancel');
    if(mc){mc.click();return;}
    if(stageEl.classList.contains('on')){const sk=document.querySelector('.st-skip');if(sk)sk.click();}
    return;
  }
  if(e.key!=='Enter')return;
  if(e.target.id==='tea-pwd'){document.querySelector('[data-act="tea-go"]').click();}
  else if(e.target.id==='sl-pw'||e.target.id==='sl-pw2'||e.target.id==='sl-no'){
    const b=document.querySelector(`[data-act="${state.stuMode==='login'?'stu-login':'stu-reg'}"]`);if(b)b.click();
  }
  else if(e.target.id==='search'){e.target.blur();}
  else if(e.target.id==='rd-code'){document.querySelector('[data-act="redeem-quick"]').click();}
  else if(/^rt-(sp|a1|a2|b1|b2)$/.test(e.target.id||'')){const b=document.querySelector('[data-act="rates-save"]');if(b)b.click();}
  else if(e.target.id==='ar-name'){const b=document.querySelector('[data-act="ar-confirm"]');if(b)b.click();}
  else if(e.target.dataset&&e.target.dataset.name){e.target.blur();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){state.search=e.target.value.trim();render();
    const s=$('#search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp-file'){
    const f=e.target.files[0];e.target.value='';
    if(!f)return;
    const rd=new FileReader();
    rd.onload=async()=>{
      try{
        const o=JSON.parse(rd.result);
        if(o&&o.data&&o.name&&!o.students){SFX.err();toast('这是单份归档文件 · 请导入完整备份','warn');return;}
        if(!o||!Array.isArray(o.students)||o.students.length!==50){SFX.err();toast('备份文件无效','warn');return;}
        const cardsN=o.students.reduce((a,s)=>a+Object.values(s.cards||{}).reduce((x,y)=>x+(y|0),0),0);
        const ok=await modal({title:'导入备份',danger:true,okText:'覆盖导入',
          body:`将<b>覆盖</b>当前全部数据：50 名学生 · 得卡 ${cardsN} 张${o.spDrawn?' · 文曲星已出':''}。<div class="m-hint">${CLOUD.enabled()?'导入后将同步覆盖云端。':'当前数据建议先「导出备份」留存。'}</div>`});
        if(!ok)return;
        DB=normalizeDB(o);save();syncSnd();render();SFX.bell();toast('备份已导入','ok');
      }catch(err){SFX.err();toast('备份解析失败','warn');}
    };
    rd.readAsText(f);
    return;
  }
  if(e.target.id==='bg-file'){
    const f=e.target.files[0];e.target.value='';
    if(!f)return;
    if(!/^image\//.test(f.type)){SFX.err();toast('请选择图片文件','warn');return;}
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const MAX=1600;
          const ratio=Math.min(1,MAX/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(img.width*ratio);cv.height=Math.round(img.height*ratio);
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          const data=cv.toDataURL('image/jpeg',.72);
          if(setCustomBG(data)){SFX.bell();toast('背景已更换（仅本机生效）','ok');if(state.screen==='tea')render();}
        }catch(err){SFX.err();toast('图片处理失败','warn');}
      };
      img.onerror=()=>{SFX.err();toast('图片读取失败','warn');};
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
    return;
  }
  const ck=e.target.closest('input[data-ck]');
  if(!ck)return;
  const id=+ck.dataset.ck;
  ck.checked?state.ids.add(id):state.ids.delete(id);
  const bar=document.querySelector('.batch-bar .bb-t');
  if(bar)bar.textContent=`已选 ${state.ids.size} 人 · 每人发放`;
});

/* ==================== 启动（平铺语句 · 已修复括号缺陷） ==================== */
const sess=parseInt(localStorage.getItem(SKEY));
if(sess&&sess>=1&&sess<=50&&DB.accounts[String(sess)]){
  state.sid=sess;state.screen='stu';
}
render();syncSnd();applyCustomBG();
cloudStartup();
</script>
</body>
</html>
